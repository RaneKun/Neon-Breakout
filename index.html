<script>
"use strict";
/* ==========================================================================
   NEON BREAKOUT - web port
   Faithful port of the Python/Pygame original: procedurally generated audio
   (Web Audio API, no external assets), fixed-landscape logical canvas scaled
   to fit any screen, persistent config + high scores (localStorage), full
   button-driven menu, pause system, keyboard/mouse controls plus a touch
   layer for mobile. Portrait phones get a rotate prompt (landscape-native
   game, unlike the portrait-native Void Breaker).
   ========================================================================== */

const log = (...a) => { try { console.log("[NB]", ...a); } catch(e){} };

// --------------------------------------------------------------------------
// SEEDED RNG - used for deterministic per-stage brick layouts (numbered
// stages replay identically every time, matching the original's seeded
// random.Random(stage*7919+13)). Endless mode uses plain Math.random(),
// matching the original's unseeded layouts there.
// --------------------------------------------------------------------------
function makeSeededRng(seed){
  let s = seed >>> 0;
  return function(){
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rngInt(rng, min, max){ return min + Math.floor(rng() * (max - min + 1)); } // inclusive both ends, matches Python randint
function choice(arr, rng){ const r = rng ? rng() : Math.random(); return arr[Math.floor(r * arr.length)]; }
function randRange([a, b], rng){ const r = rng ? rng() : Math.random(); return a + r * (b - a); }
function weightedChoice(items, weights, rng){
  const total = weights.reduce((a, b) => a + b, 0);
  if (total <= 0) return items[items.length - 1];
  let r = (rng ? rng() : Math.random()) * total;
  for (let i = 0; i < items.length; i++){
    r -= weights[i];
    if (r <= 0) return items[i];
  }
  return items[items.length - 1];
}

// --------------------------------------------------------------------------
// PERSISTENCE (config + high scores) - localStorage, with an in-memory
// fallback so the game still runs perfectly if storage is blocked.
// --------------------------------------------------------------------------
const STORAGE_PREFIX = "neonbreakout.";
const _memStore = {};
const storage = {
  get(key){
    try { const v = window.localStorage.getItem(STORAGE_PREFIX + key); return v === null ? undefined : v; }
    catch(e){ return _memStore[key]; }
  },
  set(key, val){
    try { window.localStorage.setItem(STORAGE_PREFIX + key, val); }
    catch(e){ _memStore[key] = val; }
  }
};

const MAX_HIGHSCORES = 10;
const DEFAULT_CONFIG = {
  max_stage_reached: 1,
  game_completed: false,
  bgm_on: true,
  sfx_on: true,
  fullscreen: false,
};

function loadConfig(){
  const cfg = Object.assign({}, DEFAULT_CONFIG);
  try {
    const raw = storage.get("config");
    if (raw){
      const data = JSON.parse(raw);
      if (data && typeof data === "object") for (const k in DEFAULT_CONFIG) if (k in data) cfg[k] = data[k];
    }
  } catch(e){ /* corrupt/missing - use defaults */ }
  return cfg;
}
function saveConfig(cfg){ try { storage.set("config", JSON.stringify(cfg)); } catch(e){ log("Failed to save config", e); } }

function loadHighscores(){
  try {
    const raw = storage.get("scores");
    if (!raw) return [];
    const data = JSON.parse(raw);
    if (!Array.isArray(data)) return [];
    let cleaned = data.filter(e => e && typeof e === "object" && "score" in e && "stage" in e);
    cleaned.forEach(e => { if (!("endless" in e)) e.endless = false; });
    cleaned.sort((a,b) => b.score - a.score);
    return cleaned.slice(0, MAX_HIGHSCORES);
  } catch(e){ return []; }
}
function saveHighscore(score, stage, endless=false, runId=null){
  let scores = loadHighscores();
  if (runId !== null) scores = scores.filter(e => e.run_id !== runId);
  const entry = { score, stage, endless };
  if (runId !== null) entry.run_id = runId;
  scores.push(entry);
  scores.sort((a,b) => b.score - a.score);
  scores = scores.slice(0, MAX_HIGHSCORES);
  try { storage.set("scores", JSON.stringify(scores)); } catch(e){ log("Failed to save high scores", e); }
  return scores;
}
function updateProgress(CONFIG, stageCleared){
  let changed = false;
  const nextStage = Math.min(TOTAL_STAGES, stageCleared + 1);
  if (nextStage > (CONFIG.max_stage_reached || 1)) { CONFIG.max_stage_reached = nextStage; changed = true; }
  if (stageCleared >= TOTAL_STAGES && !CONFIG.game_completed) { CONFIG.game_completed = true; changed = true; }
  if (changed) saveConfig(CONFIG);
}

const CONFIG = loadConfig();
let SFX_ON = !!CONFIG.sfx_on;
let BGM_ON = !!CONFIG.bgm_on;

// --------------------------------------------------------------------------
// RESOLUTION - fixed landscape logical canvas (matches the original's design
// resolution). Scaled to fit any screen via CSS, DPR-aware for crispness.
// --------------------------------------------------------------------------
const DESIGN_W = 1000, DESIGN_H = 700;
const DESIGN_RATIO = DESIGN_W / DESIGN_H; // 10:7 ~= 1.4286
let WIDTH = DESIGN_W, HEIGHT = DESIGN_H;
const TOTAL_STAGES = 10;

// Aspect ratios from 5:4 up through 16:9 all fill the screen completely
// (spanning - and including - the design ratio itself); anything more
// extreme (21:9, 32:9 ultrawide, or unusually narrow/tall) falls back to a
// fixed 1000x700 with standard letterbox/pillarbox instead of stretching.
const FILL_MIN_RATIO = 5 / 4;   // 1.25
const FILL_MAX_RATIO = 16 / 9;  // ~1.7778

function computeDynamicResolution(vw, vh){
  if (!(vw > 0) || !(vh > 0)) return { w: DESIGN_W, h: DESIGN_H };
  const viewportRatio = vw / vh;
  if (viewportRatio < FILL_MIN_RATIO || viewportRatio > FILL_MAX_RATIO) return { w: DESIGN_W, h: DESIGN_H };
  if (viewportRatio >= DESIGN_RATIO) return { w: Math.round(DESIGN_H * viewportRatio), h: DESIGN_H };
  return { w: DESIGN_W, h: Math.round(DESIGN_W / viewportRatio) };
}

// Only called at safe "fresh layout" boundaries (boot, loadStage) - never
// mid-stage - so bricks/paddle/HUD are always laid out against dimensions
// that are about to be used for a brand new layout anyway, never yanked out
// from under an already-placed brick field.
function applyDynamicResolution(){
  const vw = stageEl ? stageEl.clientWidth : window.innerWidth;
  const vh = stageEl ? stageEl.clientHeight : window.innerHeight;
  const res = computeDynamicResolution(vw, vh);
  WIDTH = res.w; HEIGHT = res.h;
  PADDLE_Y = HEIGHT - 50;
  if (typeof initStars === "function") initStars();
  if (typeof resizeCanvas === "function") resizeCanvas();
}

// frame-rate-independent "close X% of the gap per tick, assumed 60fps" helper.
function approachFactor(perTickFactor, dt){ return 1 - Math.pow(1 - perTickFactor, dt * 60); }
function decay60(factorPerTickAt60, dt){ return Math.pow(factorPerTickAt60, dt * 60); }

// --------------------------------------------------------------------------
// AUDIO ENGINE - all procedural, no external files. SFX build fast and
// synchronously; the ~2 minute generative music track builds in small
// per-bar chunks in the background (learned the hard way on Void Breaker:
// building it in one big synchronous block freezes the page even if you
// "defer" when it starts - it still blocks once it starts).
// --------------------------------------------------------------------------
const SAMPLE_RATE = 44100;
let audioCtx = null;
let SOUND_ENABLED = true;
const SOUNDS = {};
let musicBuffer = null;
let musicSource = null;
let musicGain = null;
let sfxGain = null;
let _audioUnlocked = false;

function midiToFreq(m){ return 440.0 * Math.pow(2, (m - 69) / 12); }

function linspace(start, stop, num, endpoint = true){
  const out = new Float64Array(Math.max(0, num));
  if (num <= 0) return out;
  if (num === 1) { out[0] = start; return out; }
  const denom = endpoint ? (num - 1) : num;
  const step = (stop - start) / denom;
  for (let i = 0; i < num; i++) out[i] = start + step * i;
  return out;
}

// ---- basic tone/sweep generators, used for one-off SFX -------------------
function toneArray(freq, dur, wave = "square", vol = 0.35, fade = true){
  const n = Math.max(1, Math.floor(SAMPLE_RATE * dur));
  const data = new Float64Array(n);
  for (let i = 0; i < n; i++){
    const t = i * dur / n;
    let v;
    if (wave === "square") v = Math.sign(Math.sin(2*Math.PI*freq*t));
    else if (wave === "saw") v = 2*(t*freq - Math.floor(0.5 + t*freq));
    else if (wave === "tri") v = 2*Math.abs(2*(t*freq - Math.floor(t*freq + 0.5))) - 1;
    else if (wave === "noise") v = Math.random()*2 - 1;
    else v = Math.sin(2*Math.PI*freq*t);
    data[i] = v;
  }
  if (fade){
    const fl = Math.max(1, Math.floor(n*0.25));
    const fadeEnv = linspace(1, 0, fl);
    for (let i = 0; i < fl; i++) data[n-fl+i] *= fadeEnv[i];
  }
  for (let i = 0; i < n; i++) data[i] *= vol;
  return data;
}

function sweepArray(f0, f1, dur, wave = "square", vol = 0.35){
  const n = Math.max(1, Math.floor(SAMPLE_RATE * dur));
  const data = new Float64Array(n);
  const freqEnv = linspace(f0, f1, n);
  let phase = 0;
  for (let i = 0; i < n; i++){
    phase += 2*Math.PI*freqEnv[i]/SAMPLE_RATE;
    data[i] = wave === "square" ? Math.sign(Math.sin(phase)) : Math.sin(phase);
  }
  const fl = Math.max(1, Math.floor(n*0.3));
  const fadeEnv = linspace(1, 0, fl);
  for (let i = 0; i < fl; i++) data[n-fl+i] *= fadeEnv[i];
  for (let i = 0; i < n; i++) data[i] *= vol;
  return data;
}

function concatArrays(...arrays){
  const total = arrays.reduce((s,a) => s+a.length, 0);
  const out = new Float64Array(total);
  let off = 0;
  for (const a of arrays){ out.set(a, off); off += a.length; }
  return out;
}
function sumArrays(...arrays){
  const n = Math.max(...arrays.map(a => a.length));
  const out = new Float64Array(n);
  for (const a of arrays) for (let i=0;i<a.length;i++) out[i] += a[i];
  return out;
}

function toAudioBuffer(mono){
  const n = mono.length;
  const buf = audioCtx.createBuffer(2, Math.max(1,n), SAMPLE_RATE);
  const ch0 = buf.getChannelData(0), ch1 = buf.getChannelData(1);
  for (let i = 0; i < n; i++){
    let v = mono[i];
    if (v > 1) v = 1; else if (v < -1) v = -1;
    ch0[i] = v; ch1[i] = v;
  }
  return buf;
}

function arpeggioSound(freqs, noteDur = 0.09, wave = "square", vol = 0.3){
  return toAudioBuffer(concatArrays(...freqs.map(f => toneArray(f, noteDur, wave, vol))));
}
